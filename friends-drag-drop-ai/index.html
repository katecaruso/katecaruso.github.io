<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The One Where Everybody Gets Sorted</title>
<style>
  :root { --purple:#53306d; --gold:#b78320; --ink:#29202c; --coffee:#563a2f; }
  * { box-sizing:border-box; }
  body { margin:0; padding:28px 18px; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:repeating-linear-gradient(45deg,#f7eedc,#f7eedc 22px,#f3e8d3 22px,#f3e8d3 44px); }
  main { max-width:1100px; margin:auto; background:#fffaf1; padding:clamp(18px,4vw,38px); border:3px solid var(--purple); border-radius:18px; box-shadow:0 12px 35px #442a1d29; }
  header { text-align:center; border-bottom:3px solid var(--gold); padding-bottom:16px; margin-bottom:22px; }
  .eyebrow { text-transform:uppercase; letter-spacing:.2em; font-size:.8rem; font-weight:700; color:var(--coffee); }
  h1 { font-family:'Trebuchet MS','Comic Sans MS',cursive; color:var(--purple); font-size:clamp(1.9rem,5vw,3.1rem); line-height:1.15; margin:12px 0; }
  .instructions { line-height:1.6; font-size:1.06rem; margin:8px 0; }
  .toolbar { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .layout { display:grid; grid-template-columns:minmax(220px,1fr) 2fr; gap:20px; align-items:start; }
  .panel { background:#fff; border:1px solid #cbbda7; border-radius:12px; padding:18px; box-shadow:0 3px 12px #513a2912; }
  h2 { color:var(--coffee); margin:0 0 15px; font-size:1.3rem; }
  .cards { display:flex; flex-wrap:wrap; gap:9px; min-height:65px; }
  .card { background:#fff0ba; color:#282018; border:2px solid #8c641d; padding:11px 12px; border-radius:8px; cursor:grab; touch-action:none; user-select:none; font-size:.96rem; line-height:1.4; font-weight:600; box-shadow:0 2px 3px #00000012; }
  .card:focus-visible,.card.selected { outline:3px solid var(--purple); outline-offset:2px; }
  .card.correct { background:#c6ebcd; color:#153e22; border-color:#216438; }
  .card.incorrect { background:#f7c6c6; color:#681b1b; border-color:#9e2929; }
  .card.dragging { opacity:.3; }
  .drag-ghost { position:fixed; z-index:1000; pointer-events:none; opacity:.93; margin:0; box-shadow:0 6px 18px #0004; max-width:240px; }
  .source-over { outline:3px dashed var(--purple); outline-offset:4px; }
  .targets { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
  .target { min-height:155px; border:2px dashed #816b88; border-radius:10px; padding:12px; background:#f5effb; }
  .target[data-category="monica"] { background:#f9e9ec; }
  .target[data-category="rachel"] { background:#fff2db; }
  .target[data-category="phoebe"] { background:#e9f3e5; }
  .target[data-category="chandler"] { background:#e7eef8; }
  .target[data-category="ross"] { background:#f0e8f8; }
  .target[data-category="joey"] { background:#fbeee3; }
  .target.over { outline:3px solid var(--purple); outline-offset:2px; }
  .target h3 { color:#392640; margin:0 0 12px; font-size:1.1rem; }
  .target .cards { align-content:start; }
  .count { font-size:.8rem; color:#514755; font-weight:normal; }
  button { padding:11px 18px; border:2px solid #44245b; border-radius:8px; background:var(--purple); color:white; font-size:1rem; font-weight:700; cursor:pointer; }
  button:hover { background:#3b2051; }
  button:focus-visible { outline:3px solid var(--gold); outline-offset:3px; }
  #score { font-size:1.1rem; font-weight:700; color:var(--purple); }
  #status { min-height:26px; line-height:1.5; font-weight:600; }
  footer { text-align:center; margin-top:30px; padding-top:16px; border-top:2px solid var(--gold); color:#4d3b32; font-size:.9rem; }
  @media(max-width:720px) { body { padding:10px; } .layout { grid-template-columns:1fr; } .targets { grid-template-columns:1fr; } .panel { padding:13px; } }
</style>
</head>
<body>
<main>
<header><div class="eyebrow">The Coffeehouse Sorting Challenge</div><h1>The One Where Everybody Gets Sorted</h1>
<p class="instructions">Drag each clue into the box for the Friends character it describes.</p></header>
<div class="toolbar"><button id="reset" type="button">Reset quiz</button>
<p id="score" aria-live="polite"><strong>0 of 18 correct</strong></p></div>
<p id="status" role="status" aria-live="polite"></p>
<div class="layout">
  <section class="panel" aria-label="Unsorted clues">
    <h2>Clue Cards</h2>
    <div id="source" class="cards"></div>
  </section>
  <section class="panel" aria-label="Category boxes">
    <h2>Categories</h2>
    <div id="targets" class="targets"></div>
  </section>
</div>
<footer>Kate Caruso · EME 6208 DIME · University of Florida</footer>
</main>
<script>
'use strict';
const categories = [
  {id: 'monica', label: 'Monica'},
  {id: 'rachel', label: 'Rachel'},
  {id: 'phoebe', label: 'Phoebe'},
  {id: 'chandler', label: 'Chandler'},
  {id: 'ross', label: 'Ross'},
  {id: 'joey', label: 'Joey'}
];
const clueGroups = {
  monica: ['Chef', 'Clean Freak', '“I know!”'],
  rachel: ['Fashion', 'Ralph Lauren', '“It’s a metaphor, Daddy!”'],
  phoebe: ['Smelly Cat', 'Massage therapist', '“He’s her lobster!”'],
  chandler: ['Sarcasm', 'Transponster', '“Gum would be perfection.”'],
  ross: ['Paleontologist', 'Unagi', '“We were on a break!”'],
  joey: ['Dr. Drake Ramoray', 'Sandwiches', '“How you doin’?”']
};
const clues = categories.flatMap(category =>
  clueGroups[category.id].map((clue, index) => ({
    id: `${category.id}-${index + 1}`,
    text: clue,
    answer: category.id
  }))
);
function shuffle(items) {
  const result = [...items];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}
const source = document.getElementById('source');
const targets = document.getElementById('targets');
const status = document.getElementById('status');
const score = document.getElementById('score');
let selected = null;
let pointerDrag = null;
let suppressClickUntil = 0;

function setStatus(message) { status.textContent = message; }
function countIn(target) { return target.querySelectorAll('.card').length; }
function clearSelection() {
  if (selected) selected.classList.remove('selected');
  selected = null;
}
function selectCard(card) {
  clearSelection();
  selected = card;
  card.classList.add('selected');
  setStatus(`${card.textContent} selected. Tap a category or the clue area.`);
}
function updateCounts() {
  document.querySelectorAll('.target').forEach(target => {
    target.querySelector('.count').textContent = `(${countIn(target)}/3)`;
  });
  const correct = document.querySelectorAll('.target .card.correct').length;
  score.textContent = `${correct} of ${clues.length} correct`;
  if (correct === clues.length) {
    setStatus('Congratulations! All 18 clues are sorted correctly!');
  }
}
function moveCard(card, destination) {
  if (!card || !destination) return;
  const area = destination.classList.contains('target')
    ? destination.querySelector('.cards') : source;
  if (card.parentElement === area) {
    clearSelection();
    return;
  }
  if (destination.classList.contains('target') && countIn(destination) >= 3) {
    setStatus('That box is full. Each character can hold only 3 cards.');
    return;
  }
  area.appendChild(card);
  const inBox = destination.classList.contains('target');
  const correct = inBox && card.dataset.answer === destination.dataset.category;
  card.classList.toggle('correct', correct);
  card.classList.toggle('incorrect', inBox && !correct);
  clearSelection();
  setStatus(!inBox ? 'Card returned to the clue area.' :
    correct ? 'Correct placement!' : 'Not quite. Move the card to try another box.');
  updateCounts();
}
function findDestination(x, y) {
  const element = document.elementFromPoint(x, y);
  if (!element) return null;
  return element.closest('.target') || (element.closest('#source') ? source : null);
}
function clearHighlights() {
  document.querySelectorAll('.target.over').forEach(t => t.classList.remove('over'));
  source.classList.remove('source-over');
}
function createCard(clue) {
  const card = document.createElement('div');
  card.className = 'card';
  card.textContent = clue.text;
  card.dataset.answer = clue.answer;
  card.id = clue.id;
  card.tabIndex = 0;
  card.setAttribute('role', 'button');
  card.setAttribute('aria-label', `${clue.text}. Select to place or move.`);
  // Pointer Events support mouse, touch and pen using the same drag behavior.
  card.addEventListener('pointerdown', event => {
    if (event.button !== 0 || pointerDrag) return;
    const rect = card.getBoundingClientRect();
    pointerDrag = {
      card, id: event.pointerId, x: event.clientX, y: event.clientY,
      dx: event.clientX - rect.left, dy: event.clientY - rect.top,
      active: false, ghost: null
    };
    card.setPointerCapture(event.pointerId);
  });
  card.addEventListener('pointermove', event => {
    const drag = pointerDrag;
    if (!drag || drag.card !== card || drag.id !== event.pointerId) return;
    if (!drag.active && Math.hypot(event.clientX - drag.x, event.clientY - drag.y) < 7) return;
    if (!drag.active) {
      drag.active = true;
      drag.ghost = card.cloneNode(true);
      drag.ghost.removeAttribute('id');
      drag.ghost.classList.add('drag-ghost');
      drag.ghost.style.width = `${card.getBoundingClientRect().width}px`;
      document.body.appendChild(drag.ghost);
      card.classList.add('dragging');
    }
    drag.ghost.style.left = `${event.clientX - drag.dx}px`;
    drag.ghost.style.top = `${event.clientY - drag.dy}px`;
    clearHighlights();
    const destination = findDestination(event.clientX, event.clientY);
    if (destination === source) source.classList.add('source-over');
    else if (destination) destination.classList.add('over');
  });
  function finishPointer(event, canceled = false) {
    const drag = pointerDrag;
    if (!drag || drag.card !== card || drag.id !== event.pointerId) return;
    pointerDrag = null;
    if (drag.active) {
      const destination = !canceled && findDestination(event.clientX, event.clientY);
      drag.ghost.remove();
      card.classList.remove('dragging');
      clearHighlights();
      suppressClickUntil = Date.now() + 400;
      if (destination) moveCard(card, destination);
      else setStatus('Drop the card inside a category or the clue area.');
    }
  }
  card.addEventListener('pointerup', event => finishPointer(event));
  card.addEventListener('pointercancel', event => finishPointer(event, true));
  card.addEventListener('click', event => {
    event.stopPropagation();
    if (Date.now() < suppressClickUntil) return;
    selectCard(card);
  });
  card.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      selectCard(card);
    }
  });
  return card;
}
function build() {
  if (pointerDrag?.ghost) pointerDrag.ghost.remove();
  pointerDrag = null;
  clearSelection();
  source.replaceChildren();
  targets.replaceChildren();
  shuffle(clues).forEach(clue => source.appendChild(createCard(clue)));
  categories.forEach(category => {
    const target = document.createElement('div');
    target.className = 'target';
    target.dataset.category = category.id;
    target.tabIndex = 0;
    target.setAttribute('role', 'button');
    target.setAttribute('aria-label', `Place selected card in ${category.label}`);
    const heading = document.createElement('h3');
    heading.textContent = category.label + ' ';
    const count = document.createElement('span');
    count.className = 'count';
    heading.appendChild(count);
    const area = document.createElement('div');
    area.className = 'cards';
    target.append(heading, area);
    target.addEventListener('click', () => {
      if (Date.now() >= suppressClickUntil && selected) moveCard(selected, target);
    });
    target.addEventListener('keydown', event => {
      if ((event.key === 'Enter' || event.key === ' ') && selected) {
        event.preventDefault();
        moveCard(selected, target);
      }
    });
    targets.appendChild(target);
  });
  updateCounts();
  setStatus('Ready to sort. Drag a clue or tap a clue and then its category.');
}
source.addEventListener('click', () => {
  if (Date.now() >= suppressClickUntil && selected) moveCard(selected, source);
});
document.getElementById('reset').addEventListener('click', build);
build();
</script>
</body>
</html>
